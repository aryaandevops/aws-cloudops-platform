name: CloudOps OIDC Test

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub OIDC environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "OIDC request URL exists: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC token request token exists: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
